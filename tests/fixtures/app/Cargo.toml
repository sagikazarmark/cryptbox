[package]
name = "cryptbox-e2e"
version = "0.0.0"
edition = "2024"
publish = false

[features]
sqlite = ["cryptbox/sqlx-sqlite", "sqlx/sqlite"]
postgres = ["cryptbox/sqlx-postgres", "sqlx/postgres"]
maintenance = ["cryptbox/migrate"]
legacy-migration = ["maintenance", "dep:chacha20poly1305", "dep:getrandom"]
macro-check = ["sqlx/macros"]

[dependencies]
cryptbox = { path = "../../.." }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"], optional = true }
getrandom = { version = "0.4", optional = true }
futures-executor = "0.3.34"
hex = "0.4"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zeroize = { version = "1", features = ["alloc"] }

[[bin]]
name = "searchable"
path = "../../../docs/snippets/searchable.rs"

[[bin]]
name = "automatic"
path = "../../../docs/snippets/testing-automatic.rs"
required-features = ["sqlite"]

[[bin]]
name = "diagnostics"
path = "../../../docs/snippets/testing-diagnostics.rs"
