# Shared by local, GitHub Actions, and Dagger link checks (Lychee 0.24.2).
include_fragments = "full"
include_verbatim = false
include_mail = false
no_progress = true
timeout = 30
max_retries = 2
max_concurrency = 8

# Research cites PDF section fragments; Lychee cannot extract PDF anchors.
# Check the PDF resource, but not the fragment (see scripts/check-links.sh).
# No host-wide exclusions or acceptance of rate-limit/error responses.
