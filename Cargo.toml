[package]
name = "cryptbox"
version = "0.6.0"
description = "Strongly typed application-layer encryption for Rust values"
edition = "2024"
rust-version = "1.85"
autoexamples = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/cryptbox"
keywords = ["cryptography", "database", "encryption", "security", "sqlx"]
categories = ["cryptography", "database"]
# Process-level tests build the unpublished workspace fixture, which is not
# archived; the rest is repository tooling.
exclude = [
    "/tests/e2e.rs",
    "/tests/e2e/",
    "/.editorconfig",
    "/.github/",
    "/.gitignore",
    "/examples/sqlite/.gitignore",
    "/AGENTS.md",
    "/CONTEXT.md",
    "/dagger*",
    "/deny.toml",
    "/devenv*",
    "/docs/agents/",
    "/fuzz/",
    "/lychee.toml",
]

[workspace]
members = ["cryptbox-derive", "examples/searchable", "tests/fixtures/app"]
default-members = ["."]
resolver = "2"

[features]
default = []
# Derive macros for `Seal`, `BlindIndexSpec`, and `Record`.
derive = ["dep:cryptbox-derive"]
json = ["serde", "dep:serde_json"]
migrate = []
serde = ["dep:serde"]
sqlx-postgres = ["dep:sqlx", "sqlx/postgres"]
sqlx-sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
base64 = { version = "0.23.1", default-features = false }
# Erase the derived key the AEAD copies, and its ChaCha20 state, on drop.
chacha20poly1305 = { version = "0.11.0", features = ["alloc", "zeroize"], default-features = false }
# Lockstep: generated code names this exact version's public items.
cryptbox-derive = { version = "=0.6.0", path = "cryptbox-derive", optional = true }
getrandom = "0.4.3"
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
hkdf = "0.13.0"
hmac = { version = "0.13.0", features = ["zeroize"] }
# Activate erasure of one-time MAC state used through chacha20poly1305.
poly1305 = { version = "0.9.1", features = ["zeroize"], default-features = false }
serde = { version = "1.0.219", optional = true }
# `float_roundtrip` decodes every float to exactly the value that was encoded.
serde_json = { version = "1.0.140", features = ["float_roundtrip"], optional = true }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sqlx = { version = "0.8.6", default-features = false, optional = true }
subtle = "2.6.1"
thiserror = "2.0.12"
# Parses and formats identifiers, checks ID literals at compile time, and is a
# record ID type.
uuid = { version = "1.18.1", default-features = false }
zeroize = { version = "1.8.1", features = ["alloc"], default-features = false }

[dev-dependencies]
base64 = "0.23.1"
fs2 = "0.4.3"
futures-executor = "0.3.34"
hex = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
# The live PostgreSQL tests need an async runtime; the library itself stays runtime-agnostic.
# `derive` checks that `#[derive(Record)]` stored forms derive `FromRow`.
sqlx = { version = "0.8.6", features = ["derive", "runtime-tokio", "uuid"], default-features = false }
tokio = { version = "1", features = ["net", "rt", "time"], default-features = false }
url = "2"
uuid = { version = "1.18.1", features = ["serde"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "deny"

[[example]]
name = "first_seal"

[[example]]
name = "tenant_seal"

[[example]]
name = "blind_indexes"
required-features = ["derive"]

[[example]]
name = "key_rotation"
required-features = ["derive"]

[[example]]
name = "stored_values"
path = "examples/stored_values/main.rs"
required-features = ["derive", "serde"]

[[example]]
name = "sqlx_sqlite"
path = "examples/sqlite/main.rs"
required-features = ["derive", "sqlx-sqlite"]

[[example]]
name = "records"
path = "examples/records/main.rs"
required-features = ["derive", "json", "sqlx-sqlite"]

[[example]]
name = "custom_seal"
path = "examples/custom_seal/main.rs"

[[example]]
name = "reencryption_sweep"
required-features = ["derive", "sqlx-sqlite"]

[[example]]
name = "plaintext_migration"
required-features = ["derive", "migrate", "sqlx-sqlite"]

[[example]]
name = "legacy_migration"
required-features = ["derive", "migrate", "sqlx-sqlite"]

[package.metadata.docs.rs]
all-features = true
# Labels each item with the features it needs.
rustdoc-args = ["--cfg", "docsrs"]

[[package.metadata.dagger.modules]]
name = "rust"
# Includes no-default, default, individual-feature, and all-feature runs.
hack.doc = ["--locked", "--each-feature"]
# Pairwise coverage keeps migrate + each SQLx backend independent.
hack.test = ["--locked", "--feature-powerset", "--depth", "2"]

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
