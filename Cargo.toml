[package]
name = "cryptbox"
version = "0.3.0"
description = "Strongly typed application-layer encryption for Rust values"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/cryptbox"
keywords = ["cryptography", "database", "encryption", "security", "sqlx"]
categories = ["cryptography", "database"]

[features]
default = []
json = ["dep:serde", "dep:serde_json"]
postcard = ["dep:postcard", "dep:serde"]
sqlx-postgres = ["dep:sqlx", "sqlx/postgres"]
sqlx-sqlite = ["dep:sqlx", "sqlx/sqlite"]

[dependencies]
chacha20poly1305 = { version = "0.11.0", features = ["alloc"], default-features = false }
getrandom = "0.4.3"
postcard = { version = "1.1.3", features = ["alloc"], default-features = false, optional = true }
# Activate erasure of one-time MAC state used through chacha20poly1305.
poly1305 = { version = "0.9.1", features = ["zeroize"], default-features = false }
serde = { version = "1.0.219", optional = true }
serde_json = { version = "1.0.140", optional = true }
sha2 = { version = "0.11.0", features = ["zeroize"] }
sqlx = { version = "0.8.6", default-features = false, optional = true }
thiserror = "2.0.12"
zeroize = { version = "1.8.1", features = ["alloc"], default-features = false }

[dev-dependencies]
futures-executor = "0.3.34"
hex = "0.4.3"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"

[[example]]
name = "sqlx_sqlite"
required-features = ["sqlx-sqlite"]

[package.metadata.docs.rs]
all-features = true

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-message = "Release {{version}}"
tag-name = "v{{version}}"
