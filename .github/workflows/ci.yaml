name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked -p cryptbox-derive --all-targets -- -D warnings

      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.45 --locked

      - name: Test feature combinations
        run: cargo hack test --locked --feature-powerset --depth 2

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependencies
        run: cargo deny check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Install cargo-expand
        run: cargo install cargo-expand --version 1.0.126 --locked

      - name: Test derive macros
        run: cargo test --locked -p cryptbox-derive

      - name: Run examples
        run: |
          cargo run --locked --example key_rotation --features derive
          cargo run --locked --example reencryption_sweep --features derive,sqlx-sqlite
          cargo run --locked --example plaintext_migration --features derive,migrate,sqlx-sqlite
          cargo run --locked --example legacy_migration --features derive,migrate,sqlx-sqlite
          cargo run --locked --example blind_indexes --features derive
          cargo run --locked --example stored_values --features derive,serde
          cargo run --locked --example sqlx_sqlite --features derive,sqlx-sqlite
          cargo run --locked --example first_field
          cargo run --locked --example tenant_field
          cargo run --locked --example custom_field
          cargo run --locked --example records --features derive,json,sqlx-sqlite

      - name: Run documentation tests
        run: |
          cargo test --locked --doc
          cargo test --locked --doc --all-features

      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --locked --no-deps --no-default-features
          cargo doc --locked --no-deps --all-features
          cargo doc --locked --no-deps -p cryptbox-derive

      - name: Check current compatible dependencies
        run: |
          cargo update
          cargo check --all-targets --all-features

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check minimum Rust version
        run: cargo +1.85.0 check --locked --all-targets --all-features
