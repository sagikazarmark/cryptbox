name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check SQLx features independently
        run: |
          cargo check --locked --all-targets --features sqlx-postgres
          cargo check --locked --all-targets --features sqlx-sqlite

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependencies
        run: cargo deny check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Run examples
        run: |
          cargo run --locked --example key_rotation
          cargo run --locked --example reencryption_sweep --features sqlx-sqlite
          cargo run --locked --example blind_indexes
          cargo run --locked --example sqlx_sqlite --features sqlx-sqlite

      - name: Run documentation tests
        run: cargo test --locked --doc --all-features

      - name: Build API documentation
        run: |
          cargo doc --locked --no-deps --no-default-features
          cargo doc --locked --no-deps --all-features

      - name: Check current compatible dependencies
        run: |
          cargo update
          cargo check --all-targets --all-features

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check minimum Rust version
        run: cargo +1.85.0 check --locked --all-targets --all-features
