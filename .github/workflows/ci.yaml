name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Update Rust
        run: rustup update stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check SQLx features independently
        run: |
          cargo check --all-targets --features sqlx-postgres
          cargo check --all-targets --features sqlx-sqlite

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check dependencies
        run: cargo deny check

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Run examples
        run: |
          cargo run --example key_rotation
          cargo run --example blind_indexes
          cargo run --example sqlx_sqlite --features sqlx-sqlite

      - name: Run documentation tests
        run: cargo test --doc --all-features

      - name: Build API documentation
        run: |
          cargo doc --no-deps --no-default-features
          cargo doc --no-deps --all-features

  msrv:
    name: Rust 1.85
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check minimum Rust version
        run: cargo +1.85.0 check --all-targets --all-features
